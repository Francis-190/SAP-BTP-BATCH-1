_schema-version: "3.2"
ID: admin
description: Generated by Fiori Tools
version: 0.0.1
modules:
  - name: admin-destination-content
    type: com.sap.application.content
    requires:
      - name: admin-destination-service
        parameters:
          content-target: true
      - name: admin-repo-host
        parameters:
          service-key:
            name: admin-repo-host-key
      - name: admin-auth
        parameters:
          service-key:
            name: admin-auth-key
    parameters:
      content:
        instance:
          destinations:
            - Name: admin_html_repo_host
              ServiceInstanceName: admin-html5-service
              ServiceKeyName: admin-repo-host-key
              sap.cloud.service: admin
            - Authentication: OAuth2UserTokenExchange
              Name: admin_auth
              ServiceInstanceName: admin-xsuaa-service
              ServiceKeyName: admin-auth-key
              sap.cloud.service: admin
          existing_destinations_policy: update
    build-parameters:
      no-source: true
  - name: admin-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: admin-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - admin.zip
          name: admin
          target-path: resources/
  - name: admin
    type: html5
    path: .
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
resources:
  - name: admin-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: admin-destination-service
      service-plan: lite
  - name: admin-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
        tenant-mode: dedicated
        xsappname: admin-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-name: admin-xsuaa-service
      service-plan: application
  - name: admin-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: admin-html5-service
      service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
