_schema-version: 3.3.0
ID: Insurance_claim_management
description: A simple CAP project.
version: 1.0.0

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - rm -rf app/router/webapp/claimsure
        - mkdir -p app/router/webapp
        - cp -r app/claimsure app/router/webapp/claimsure

modules:
 
  - name: Insurance_claim_management-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: Insurance_claim_management-auth
      - name: Insurance_claim_management-db
      - name: Insurance_claim_management-destination
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci

  - name: Insurance_claim_management-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: Insurance_claim_management-db
      
    parameters:
      buildpack: nodejs_buildpack


  - name: Insurance_claim_management
    type: approuter.nodejs
    path: app/router
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: Insurance_claim_management-auth
      - name: Insurance_claim_management-destination
      - name: Insurance_claim_management-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
    parameters:
      disk-quota: 256M
      keep-existing-routes: true
      memory: 256M

  - name: Insurance_claim_management-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: Insurance_claim_managementclaimsure
          artifacts:
            - claimsure.zip
          target-path: app/
    requires:
      - name: srv-api
      - name: Insurance_claim_management-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true

  - name: Insurance_claim_managementclaimsure
    type: html5
    path: app/claimsure
    build-parameters:
      builder: custom
      commands:
        - rm -f claimsure.zip
        - zip -qr claimsure.zip . -x "./claimsure.zip" "./node_modules/*" "./.git/*"
      build-result: .
      supported-platforms: []
  - name: Insurance_claim_management-destinations
    type: com.sap.application.content
    requires:
      - name: Insurance_claim_management-html5-repo-host
        parameters:
          service-key:
            name: Insurance_claim_management-html5-repo-host-key
      - name: srv-api
      - name: Insurance_claim_management-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: Insurance_claim_management-html5-repository
              ServiceInstanceName: Insurance_claim_management-html5-repo-host
              ServiceKeyName: Insurance_claim_management-html5-repo-host-key
              sap.cloud.service: Insurance_claim_management.service

resources:
  - name: Insurance_claim_management-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        tenant-mode: dedicated
        xsappname: Insurance_claim_management-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
    requires:
      - name: app-api

  - name: Insurance_claim_management-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: Insurance_claim_management-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api

  - name: Insurance_claim_management-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: Insurance_claim_management-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
