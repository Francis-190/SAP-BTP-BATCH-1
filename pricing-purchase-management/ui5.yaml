# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: salesordermanagement
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /odata
            url: https://c03c15a0trial-dev-tafe-srv.cfapps.us10-001.hana.ondemand.com
            destination: TAFE_BACKEND
          - path: /odata/v4/analytics/
            url: https://c03c15a0trial-dev-tafe-srv.cfapps.us10-001.hana.ondemand.com
            destination: TAFE_BACKEND
          - path: /odata/v4/dealer/
            url: https://c03c15a0trial-dev-tafe-srv.cfapps.us10-001.hana.ondemand.com
            destination: TAFE_BACKEND
          - path: /inventory/
            url: https://c03c15a0trial-dev-tafe-srv.cfapps.us10-001.hana.ondemand.com
            destination: TAFE_BACKEND
          - path: /pricing/
            url: https://c03c15a0trial-dev-tafe-srv.cfapps.us10-001.hana.ondemand.com
            destination: TAFE_BACKEND
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
          path: test/flpSandbox.html
          intent:
            object: salesordermanagement
            action: display
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
