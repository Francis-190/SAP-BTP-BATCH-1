# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: pricingmaster
type: application
framework:
  name: SAPUI5
  version: 1.152.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        backend:
          - path: /pricing
            url: https://c03c15a0trial-dev-tafe-srv.cfapps.us10-001.hana.ondemand.com
            destination: TAFE_BACKEND
          - path: /odata/v4/analytics
            url: https://c03c15a0trial-dev-tafe-srv.cfapps.us10-001.hana.ondemand.com
            destination: TAFE_BACKEND
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /pricing
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /odata/v4/analytics
            metadataPath: ./webapp/localService/analytics/metadata.xml
            mockdataPath: ./webapp/localService/analytics/data
            generateMockData: true
        annotations: []
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
