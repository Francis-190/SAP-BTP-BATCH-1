# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: pricingmaster
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /pricing
            url: https://c03c15a0trial-dev-tafe-srv.cfapps.us10-001.hana.ondemand.com
            destination: TAFE_BACKEND
          - path: /odata/v4/analytics
            url: https://c03c15a0trial-dev-tafe-srv.cfapps.us10-001.hana.ondemand.com
            destination: TAFE_BACKEND
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
